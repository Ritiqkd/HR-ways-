<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan & Pay - HR Ways</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
        }

        .header {
            background-color: #2880cd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
            text-align: center;
        }

        .scanner {
            background-color: #e0e0e0;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .action-button {
            background-color: #2880cd;
            color: white;
            border: none;
            padding: 15px 25px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.2s;
            font-size: 18px;
        }

        .action-button:hover {
            background-color: #1548ff;
            transform: translateY(-2px);
        }

        input, select {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .payment-details {
            max-width: 500px;
            margin: auto;
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>Scan & Pay</h1>
    </header>

    <main class="container">
        <h2>Complete Your Payment</h2>
        <div class="scanner">
            <img src="scanner.jpg" alt="QR Code Scanner" width="250" height="250">
        </div>

       

        <form class="payment-details" method="post" action="">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" required>

            <label for="amount">Amount to Pay</label>
            <input type="number" id="amount" name="amount" required>

            <button type="submit" class="action-button">Submit Payment</button>
        </form>
    </main>
</body>

</html>
