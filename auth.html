<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haryana Roadways</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Same CSS styles as before */
        * {
            margin: 0px;
            padding: 0px;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
        }
        .header {
            background-color: #2880cd;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-size: 26px;
            font-family: 'Poppins';
            padding-left: 20px;
            font-weight: 450;
        }
        .nav-button {
            background: transparent;
            color: white;
            font-family: 'Poppins';
            font-weight: 450;
            font-size: 16px;
            border: none;
            margin-left: 15px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .nav-button:hover {
            color: #d0d0d0;
        }
        .color {
            color: black;
        }
        .hero {
            background: url('https://source.unsplash.com/1600x400/?bus') no-repeat center center/cover;
            color: #42a7ff;
            text-align: center;
        }
        .hero h1 {
            font-size: 42px;
            margin: 0;
            padding-top: 40px;
            font-family: 'Lucida Sans';
            font-weight: 600;
        }
        .hero p {
            font-size: 20px;
            margin: 10px 0;
        }
        .cta-button {
            margin-top: 30px;
            background-color: #478efa;
            color: rgb(255, 255, 255);
            border: none;
            padding: 15px 25px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        .cta-button:hover {
            background-color: #1548ff;
            transform: translateY(-2px);
        }
        .action-button {
            background-color: #2880cd;
            color: white;
            border: none;
            padding: 15px 25px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.2s;
            width: 400px;
            font-size: 20px;
            font-family: 'Poppins';
            font-weight: 350;
            margin-left: 50px;
        }
        .action-button:hover {
            background-color: #1c6cb2;
        }
        .input {
            width: 385px;
            height: 40px;
            padding-left: 10px;
            font-size: 15px;
            border-radius: 5px;
            font-family: 'Poppins';
            font-weight: 300;
        }
        .span {
            font-family: 'Poppins';
            font-weight: 300;
            color: #1548ff;
            font-size: 13px;
            padding-left: 50px;
            margin-top: 15px;
        }
        a {
            color: white;
            font-family: 'Poppins';
            font-weight: 450;
            font-size: 16px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="title">HR ways</h1>
        <nav>
            <button class="nav-button"><a href="H3a.html">Home</a></button>
            <button class="nav-button"><a href="login.html">Log In</a></button>
            <button class="nav-button"><a href="about.html">About Us</a></button>
            <button class="nav-button"><a href="contact.html">Contact</a></button>
        </nav>
    </header>
    <center>
        <div class="image">
            <img src="hrways.jpeg" alt width="1200px" height="500px">
        </div>
    </center>
    <section class="hero">
        <h1><span class="color">Welcome to </span>HR ways</h1>
        <p>Your journey begins here. Convenient and reliable bus services for everyone.</p><br><br>
    </section>
    <center>
        <div>
            <img src="DigiLocker.svg.png" style="width: 140px; height: 40px;"><br><br>
        </center>
        <div style="width: 500px; height: 280px; background-color: white; margin-left: 520px; margin-bottom: 200px; border: 1px solid black; border-radius: 5px;">
            <br>
            <p style="font-size: 23px; font-family: 'Poppins'; font-weight: 500; padding-left: 40px;">
                Log In with your DigiLocker Account!
            </p>
            <br><br>
            <input type="text" placeholder="Enter Mobile Number or Aadhar Number" required class="input" id="loginInput" style="margin-left: 50px;"><br>
            <span class="span">Enter your registered Mobile Number / Aadhar Number</span><br><br>
            <button class="action-button" onclick="login()">Log In</button>
        </div>
    </div>

    <script>
        // JavaScript function for login
        function login() {
            const inputField = document.getElementById('loginInput');
            const inputValue = inputField.value.trim();

            // Check if the input is empty
            if (inputValue === "") {
                alert("Please enter your Mobile Number or Aadhar Number.");
                return;
            }

            // Regular expression for a basic validation of mobile number or Aadhar number
            const mobilePattern = /^[6-9]\d{9}$/;
            const aadharPattern = /^\d{12}$/;

            // Validate the input
            if (mobilePattern.test(inputValue)) {
                alert("Logging in with Mobile Number: " + inputValue);
                window.location.assign("H3a.html");
                // Add logic to handle login with mobile number
            } else if (aadharPattern.test(inputValue)) {
                alert("Logging in with Aadhar Number: " + inputValue);
                window.location.assign("H3a.html");
                // Add logic to handle login with Aadhar number
            } else {
                alert("Please enter a valid Mobile Number or Aadhar Number.");
            }
        }
    </script>
</body>
</html>
