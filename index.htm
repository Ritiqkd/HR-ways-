<!DOCTYPE html>
<html lang="en">
  <head>
    <title>login page</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: url(bg.jpg) no-repeat;
        background-size: cover;
        background-position: center;
      }
      .wrapper {
        width: 420px;
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(9px);
        color: #fff;
        border-radius: 12px;
        padding: 30px 40px;
      }
      .wrapper h1 {
        font-size: 36px;
        text-align: center;
      }
      .wrapper .input-box {
        position: relative;
        width: 100%;
        height: 50px;

        margin: 30px 0;
      }
      .input-box input {
        width: 100%;
        height: 100%;
        background: transparent;
        border: none;
        outline: none;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 40px;
        font-size: 16px;
        color: #fff;
        padding: 20px 45px 20px 20px;
      }
      .input-box input::placeholder {
        color: #fff;
      }
      .input-box i {
        position: absolute;
        right: 20px;
        top: 30%;
        transform: translate(-50%);
        font-size: 20px;
      }
      .wrapper .remember-forgot {
        display: flex;
        justify-content: space-between;
        font-size: 14.5px;
        margin: -15px 0 15px;
      }
      .remember-forgot label input {
        accent-color: #fff;
        margin-right: 3px;
      }
      .remember-forgot a {
        color: blue;
        text-decoration: underline;
      }
      .remember-forgot a:hover {
        text-decoration: underline;
      }
      .wrapper .btn {
        width: 100%;
        height: 45px;
        background: #fff;
        border: none;
        outline: none;
        border-radius: 40px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        font-size: 16px;
        color: #333;
        font-weight: 600;
      }
      .wrapper .register-link {
        font-size: 14.5px;
        text-align: center;
        margin: 20px 0 15px;
      }
      .register-link p a {
        color: blue;
        text-decoration: none;
        font-weight: 600;
        text-decoration: underline;
      }
      .register-link p a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <form onsubmit="auth()">
        <h1>Login</h1>
        <div class="input-box">
          <input 
           type="text"
           placeholder="Enter Email ID"
           id="email" />
          <i class="bx bxs-user"></i>
        </div>
        <div class="input-box">
          <input
            type="password"
            
            placeholder="Password"
            id="password"
            required
          />
          <i class="bx bxs-lock-alt"></i>
        </div>
        <div class="remember-forgot">
          <label><input type="checkbox" />Remember Me</label>
          <a href="forgotten page.html">Forgot Password</a>
        </div>
        <input type="submit"  class="btn" value="login"></input>
        <div class="register-link" >
          <p>Dont have an account?  
            <a href="Registration.html">Register</a></p>
        </div>
      </form>
    </div>
    <script>
      function auth() {
        var email = document.getElementById("email").value;
        var password = document.getElementById("password").value;
        if (email =="admin@gmail.com" && password == "123") {
          window.location.assign("welcome.html");
          alert("login Successfully");
        } 
        else {
          alert("Invalid Information");
          return;
        }
      }
    </script>
  </body>
</html>
